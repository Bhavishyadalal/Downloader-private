<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Terabox Grabber</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
            padding: 16px;
        }
        .card {
            background: rgba(10, 8, 20, 0.75);
            backdrop-filter: blur(12px);
            padding: 32px 24px;
            border-radius: 32px;
            max-width: 520px;
            width: 100%;
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15), 0 0 80px rgba(255, 0, 255, 0.1);
        }
        h1 {
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            letter-spacing: 2px;
        }
        @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .sub { text-align: center; font-size: 12px; color: #a0a8d0; margin: 4px 0 24px; letter-spacing: 3px; opacity: 0.7; }
        label { display: block; font-size: 11px; color: #7a82b0; letter-spacing: 1px; margin-bottom: 4px; font-weight: 700; }
        input, textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1.5px solid #2a2a5a;
            background: rgba(0,0,0,0.5);
            color: #e0e8ff;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            transition: 0.3s;
            margin-bottom: 14px;
            box-sizing: border-box;
        }
        textarea {
            min-height: 90px;
            resize: vertical;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        input:focus, textarea:focus { border-color: #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin-bottom: 14px;
        }
        .input-row textarea { margin-bottom: 0; flex: 1; }
        .btn-sm {
            padding: 0 16px;
            border: none;
            border-radius: 16px;
            background: #2a2a5a;
            color: #a0b0f0;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-sm:active { transform: scale(0.95); background: #4a7cff; color: #fff; }
        .hint {
            font-size: 10px;
            color: #6a7a9a;
            margin: -10px 0 14px;
            text-align: right;
        }
        .hint a {
            color: #4a7cff;
            text-decoration: none;
            border-bottom: 1px dashed #4a7cff;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(0,114,255,0.3);
        }
        .btn:active { transform: scale(0.96); box-shadow: 0 0 60px rgba(0,255,255,0.6); }
        #status {
            margin-top: 18px;
            font-size: 12px;
            color: #a0b0f0;
            text-align: center;
            min-height: 20px;
            letter-spacing: 1px;
            font-weight: 400;
            text-shadow: 0 0 10px rgba(0,255,255,0.2);
        }
        .footer {
            margin-top: 24px;
            font-size: 9px;
            color: #4a4a7a;
            text-align: center;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 16px;
        }
        .error { color: #ff6b6b !important; text-shadow: 0 0 10px rgba(255,0,0,0.3) !important; }
        .success { color: #51cf66 !important; text-shadow: 0 0 10px rgba(0,255,0,0.3) !important; }
    </style>
</head>
<body>
<div class="card">
    <h1>⬡ TERABOX ⬡</h1>
    <div class="sub">N E O N · P R O X Y</div>

    <label>🔗 BACKEND URL</label>
    <input type="text" id="backendUrl" value="https://terabox-proxy-o0pn.onrender.com" />

    <label>🍪 YOUR TERABOX COOKIES (JSON array or object)</label>
    <div class="input-row">
        <textarea id="cookiesInput" placeholder='[{"name":"cookie1","value":"val1"}, ...]'></textarea>
        <button class="btn-sm" id="pasteBtn">📋 Paste</button>
    </div>
    <div class="hint">
        <a onclick="showCookieHelp()">❓ How to get cookies?</a>
    </div>

    <label>📎 TERABOX SHARE URL</label>
    <input type="text" id="urlInput" placeholder="https://teraboxurl.com/s/..." />

    <button class="btn" id="downloadBtn">⟡ DOWNLOAD ⟡</button>
    <div id="status">⚡ ready</div>
    <div class="footer">streaming proxy · cookies stored locally only</div>
</div>
<script>
    function showCookieHelp() {
        alert(
            "📖 GET YOUR COOKIES (one time):\n\n" +
            "1. Open Chrome → go to terabox.com and LOG IN.\n" +
            "2. Tap the lock icon → Cookies → Manage site data.\n" +
            "3. Copy the cookies (you can use an extension or manually).\n\n" +
            "💡 EASIEST WAY (using Chrome DevTools):\n" +
            "   - Open terabox.com while logged in.\n" +
            "   - Open DevTools (Ctrl+Shift+I) → Console.\n" +
            "   - Paste this and press Enter:\n" +
            '      copy(JSON.stringify(document.cookie.split("; ").map(c=>{const [n,v]=c.split("=");return{name:n,value:v}})));\n' +
            "   - The cookies JSON array is now in your clipboard.\n\n" +
            "Then paste it into the field above."
        );
    }

    // Paste from clipboard
    document.getElementById('pasteBtn').addEventListener('click', async function() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('cookiesInput').value = text;
            document.getElementById('status').innerHTML = '✅ Cookies pasted from clipboard';
            document.getElementById('status').className = 'success';
        } catch (err) {
            document.getElementById('status').innerHTML = '❌ Could not read clipboard – paste manually';
            document.getElementById('status').className = 'error';
        }
    });

    // Main download – using POST to avoid URL length limit
    document.getElementById('downloadBtn').addEventListener('click', async function() {
        const url = document.getElementById('urlInput').value.trim();
        const backend = document.getElementById('backendUrl').value.trim();
        const cookiesRaw = document.getElementById('cookiesInput').value.trim();
        const status = document.getElementById('status');

        if (!url) { status.innerHTML = '❌ PASTE A TERABOX URL'; status.className = 'error'; return; }
        if (!backend) { status.innerHTML = '❌ SET BACKEND URL'; status.className = 'error'; return; }
        if (!cookiesRaw) { status.innerHTML = '❌ PASTE YOUR COOKIES (see help)'; status.className = 'error'; return; }

        let cookiesObj;
        try {
            cookiesObj = JSON.parse(cookiesRaw);
        } catch (e) {
            status.innerHTML = '❌ INVALID JSON – check format';
            status.className = 'error';
            return;
        }

        status.innerHTML = '🔄 CONTACTING PROXY WITH YOUR COOKIES ...';
        status.className = '';

        try {
            const response = await fetch(backend + '/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, cookies: cookiesObj })
            });

            if (!response.ok) {
                const errorText = await response.text();
                status.innerHTML = '❌ ERROR: ' + errorText;
                status.className = 'error';
                return;
            }

            // If response is a file stream, we need to trigger download
            // We can use a Blob to download the file
            const blob = await response.blob();
            const contentDisposition = response.headers.get('Content-Disposition');
            let filename = 'terabox_download.bin';
            if (contentDisposition) {
                const match = contentDisposition.match(/filename="(.+)"/);
                if (match) filename = match[1];
            }
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            status.innerHTML = '✅ DOWNLOAD SUCCESSFUL: ' + filename;
            status.className = 'success';
        } catch (error) {
            status.innerHTML = '❌ NETWORK ERROR: ' + error.message;
            status.className = 'error';
        }
    });
</script>
</body>
</html>
